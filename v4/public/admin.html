<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Medio Urbano · Administración V4</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav"><img class="logo" src="img/logo-marca.png" alt="Medio Urbano"><strong>Administración</strong><div class="navlinks"><a href="index.html">Tienda</a><button id="logout" class="secondary" hidden>Cerrar sesión</button></div></div></header><main><div id="loginPanel" class="panel"><h2>Acceso administrativo</h2><form id="login"><label class="field">Correo<input id="email" required type="email" autocomplete="username"></label><label class="field">Contraseña<input id="password" required type="password" autocomplete="current-password"></label><button class="primary">Ingresar</button></form></div><p id="status" role="status"></p><div id="dashboard" hidden><h1 style="font-size:45px">Centro de control</h1><div class="stats" id="stats"></div><section class="panel"><h2>Catálogo</h2><form id="productForm"><input id="id" type="hidden"><div class="grid"><label class="field">Nombre<input id="pname" maxlength="100" required></label><label class="field">Marca<select id="brand"><option>cocina</option><option>salad</option><option>burgers</option><option>pasta</option></select></label><label class="field">Precio (MXN)<input id="price" type="number" step=".01" min=".01" max="100000" required></label><label class="field">Imagen URL HTTPS o ruta local<input id="image" maxlength="1000"></label></div><label class="field">Descripción<textarea id="description" maxlength="300"></textarea></label><label class="field">Extras (uno por línea: nombre | precio MXN)<textarea id="extras"></textarea></label><label><input id="active" type="checkbox" checked> Disponible</label> <label><input id="featured" type="checkbox"> Destacado</label><div class="actions"><button class="primary">Guardar producto</button><button type="button" id="clear" class="secondary">Nuevo</button><button type="button" id="undo" class="secondary">Deshacer último cambio</button><button type="button" id="redo" class="secondary">Rehacer</button></div></form><div id="products"></div></section><section class="panel"><h2>Operación y entrega</h2><form id="configForm"><label><input type="checkbox" id="open"> Tienda abierta</label><div class="grid"><label class="field">Compra mínima (MXN)<input id="minimum" type="number" min="0" max="100000" step=".01" required></label><label class="field">WhatsApp con código de país<input id="whatsapp" maxlength="15" pattern="[0-9]*"></label></div><label class="field">Anuncio / promoción de texto<input id="announcement" maxlength="160"></label><label class="field">Zonas (nombre | costo MXN, una por línea)<textarea id="zones"></textarea></label><button class="primary">Guardar operación</button></form></section><section class="panel"><h2>Últimos 100 pedidos</h2><div id="orders"></div></section></div></main><script type="module" src="admin.js"></script></body></html>
