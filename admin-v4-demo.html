<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Medio Urbano V4 · Panel demo</title><style>
:root{color-scheme:dark;--accent:#ffd028}*{box-sizing:border-box}body{margin:0;background:#10100f;color:#faf8f2;font:15px/1.5 system-ui,sans-serif}header,main{max-width:1100px;margin:auto;padding:20px}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}header img{width:72px;height:60px;object-fit:contain}h1,h2{line-height:1.1}h1{font-size:clamp(26px,4vw,40px);margin:0}a{color:var(--accent)}small,p{color:#c3c0b6}.note{border:1px solid #ffd028;padding:12px;border-radius:10px;color:#ffd028}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card,section{background:#1b1b19;border:1px solid #3b3a33;border-radius:14px;padding:18px;margin-bottom:18px}.card strong{font-size:26px;color:#ffd028}button,input,select,textarea{font:inherit;border-radius:8px;padding:10px;border:1px solid #4d4c43;background:#22221f;color:#faf8f2}button{cursor:pointer;font-weight:700}button.primary{background:var(--accent);color:#111;border-color:var(--accent)}button:disabled{opacity:.4;cursor:not-allowed}form label{display:grid;gap:5px}form{display:grid;gap:12px}textarea{resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #393831;padding:12px 0}.row div:first-child{min-width:0;overflow-wrap:anywhere}.row small{display:block}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffd028;outline-offset:3px}@media(max-width:550px){.row{flex-direction:column;align-items:stretch}}
</style></head><body><header><img src="img/logo-marca.png" alt="Medio Urbano"><div><h1>Urban Premium · Panel</h1><small>Administración local de demostración</small></div><a href="test-v4.html">← Volver a tienda</a></header><main><p class="note">Entorno local de prueba. No es un panel autenticado ni modifica Firebase. Los datos se guardan solo en este navegador; usa información ficticia.</p><div class="grid" id="stats"></div><section><h2>Catálogo</h2><div class="actions"><button id="undo">↶ Deshacer</button><button id="redo">↷ Rehacer</button></div><form id="form"><input type="hidden" id="pid"><div class="grid"><label>Nombre<input id="nombre" required maxlength="100"></label><label>Marca<select id="marca"><option>cocina</option><option>salad</option><option>burgers</option><option>pasta</option></select></label><label>Precio MXN<input id="precio" required type="number" min="0.01" max="100000" step="0.01"></label><label>Disponibilidad<select id="estado"><option value="1">Disponible</option><option value="0">No disponible</option></select></label></div><label>Descripción<textarea id="desc" maxlength="300"></textarea></label><div class="actions"><button class="primary" type="submit">Guardar producto</button><button type="button" id="cancel">Limpiar formulario</button></div></form><div id="products"></div></section><section><h2>Configuración de entrega</h2><form id="configForm"><div class="grid"><label>Envío fijo (MXN)<input type="number" min="0" max="100000" step=".01" id="envio" required></label><label>Compra mínima (MXN)<input type="number" min="0" max="100000" step=".01" id="minimo" required></label></div><button class="primary">Guardar configuración local</button></form></section><section><h2>Pedidos de prueba</h2><div id="orders"></div></section></main><script src="js/v4-demo.js"></script><script>
const $=id=>document.getElementById(id),D=window.V4Demo,K=D.KEYS;let history=[],future=[];const statuses=["Pendiente","Preparando","En reparto","Entregado","Cancelado"];
function save(next){history.push(D.products());future=[];D.write(K.products,next);render()}
function clear(){$("form").reset();$("pid").value=""}
function render(){let ps=D.products(),os=D.orders();$("undo").disabled=!history.length;$("redo").disabled=!future.length;$("stats").replaceChildren();for(const [name,value] of [["Productos",ps.length],["Pedidos demo",os.length],["Ventas entregadas",D.money(os.filter(o=>o.estado==="Entregado").reduce((s,o)=>s+o.total,0))]]){let c=document.createElement("div");c.className="card";let h=document.createElement("small");h.textContent=name;let v=document.createElement("strong");v.style.display="block";v.textContent=value;c.append(h,v);$("stats").append(c)}$("products").replaceChildren();for(const p of ps){const r=document.createElement("div");r.className="row";const t=document.createElement("div"),h=document.createElement("b"),d=document.createElement("small");h.textContent=p.nombre;d.textContent=p.categoria+" · "+D.money(p.precio)+" · "+(p.estado?"Disponible":"No disponible");t.append(h,d);let a=document.createElement("div");a.className="actions";let e=document.createElement("button");e.textContent="Editar";e.onclick=()=>{$("pid").value=p.id;$("nombre").value=p.nombre;$("marca").value=p.categoria;$("precio").value=p.precio;$("desc").value=p.descripcion;$("estado").value=p.estado;$("nombre").focus()};let del=document.createElement("button");del.textContent="Eliminar";del.onclick=()=>{if(confirm("¿Eliminar "+p.nombre+"?"))save(ps.filter(x=>x.id!==p.id))};a.append(e,del);r.append(t,a);$("products").append(r)}$("orders").replaceChildren();if(!os.length)$("orders").textContent="Aún no hay pedidos de prueba.";for(const o of os){const r=document.createElement("div");r.className="row";const t=document.createElement("div");const h=document.createElement("b");h.textContent=o.id+" · "+D.money(o.total);const d=document.createElement("small");d.textContent=o.productos.map(p=>p.nombre+" × "+p.cantidad).join(", ");t.append(h,d);const sel=document.createElement("select");sel.setAttribute("aria-label","Estado "+o.id);for(const st of statuses){const op=document.createElement("option");op.textContent=st;op.selected=o.estado===st;sel.append(op)}sel.onchange=()=>{D.write(K.orders,D.orders().map(x=>x.id===o.id?{...x,estado:sel.value}:x));render()};r.append(t,sel);$("orders").append(r)}}
$("form").onsubmit=e=>{e.preventDefault();const id=$("pid").value||"p"+Date.now().toString(36);const p={id,nombre:$("nombre").value.trim(),categoria:$("marca").value,precio:Number($("precio").value),descripcion:$("desc").value.trim(),estado:Number($("estado").value)};if(!p.nombre||!Number.isFinite(p.precio)||p.precio<=0)return;save([...D.products().filter(x=>x.id!==id),p]);clear()};$("cancel").onclick=clear;$("undo").onclick=()=>{if(!history.length)return;future.push(D.products());D.write(K.products,history.pop());render()};$("redo").onclick=()=>{if(!future.length)return;history.push(D.products());D.write(K.products,future.pop());render()};$("envio").value=D.config().envio;$("minimo").value=D.config().minimo;$("configForm").onsubmit=e=>{e.preventDefault();D.write(K.config,{envio:Number($("envio").value),minimo:Number($("minimo").value)});alert("Configuración local guardada")};window.addEventListener("storage",render);render();
</script></body></html>
