<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Panel Administrativo | Medio Urbano</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"/>
  <link rel="stylesheet" href="css/admin-v3.css">
</head>
<body>
  <div class="login">
    <h1>MEDIO URBANO</h1>
    <h2>Panel Administrativo</h2>
    <input type="email" id="email" placeholder="Correo electrónico" autocomplete="email">
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
    <button onclick="login()">Ingresar</button>
    <div id="loginError" style="color:#ff5252;margin-top:12px;font-size:13px;text-align:center;display:none;"></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/admin-v3.js"></script>
</body>
</html>
